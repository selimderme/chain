name: Ücretsiz iOS IPA Derleme (Unsigned - Sideloadly / AltStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Repo dosyalarını çek
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps

      - name: Native iOS (Xcode) projesini oluştur (Expo Prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods bağımlılıklarını yükle
        working-directory: ios
        run: pod install

      - name: İmzasız (Unsigned) iOS Uygulamasını Derle
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Derlenen Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
             clean build

      - name: .app çıktısını .ipa dosyasına dönüştür
        run: |
          mkdir -p build_ipa/Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          echo "Found app bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app dosyası bulunamadı!"
            exit 1
          fi
          cp -r "$APP_PATH" build_ipa/Payload/
          cd build_ipa
          zip -r -q ../unsigned-app.ipa Payload

      - name: IPA Dosyasını İndirilebilir Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iOS-IPA
          path: unsigned-app.ipa
