<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Günlük Rutin</title>
  <meta name="theme-color" content="#fff4e6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-tab="beslenme">
  <header class="topbar">
    <div class="topbar-head">
      <div class="top-mode-tabs" id="topModeTabs">
        <button type="button" class="top-mode-btn active" data-section="rutin">Günlük Rutin</button>
        <button type="button" class="top-mode-btn" data-section="gorevler">Görevler <span class="top-mode-badge" id="tasksBadge" hidden>0</span></button>
      </div>
      <button type="button" id="profileBtn" class="profile-circle-btn" aria-label="Profil sayfasını aç" title="Profil">👤</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Kategoriler" id="tabs"></nav>
  </header>

  <main id="panel" class="panel" role="tabpanel" aria-live="polite"></main>

  <footer class="foot" id="mainFoot">
    <p class="legend">
      <span><i class="dot g"></i> Gün: dokun işaretle · basılı tut renk</span>
      <span><i class="dot b"></i> Kart: dokun sayaç/miktar · basılı tut düzenle</span>
    </p>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>

  <!-- Basılı tutunca açılan renk menüsü -->
  <div id="menu" class="menu" popover="manual" role="menu" aria-label="İşaret rengi seç">
    <p class="menu-title" id="menuTitle"></p>
    <button type="button" role="menuitem" data-mark="g" class="m-g"><i class="dot g"></i> Yeşil <small>Tamamlandı</small></button>
    <button type="button" role="menuitem" data-mark="b" class="m-b"><i class="dot b"></i> Mavi <small>Kısmen</small></button>
    <button type="button" role="menuitem" data-mark="r" class="m-r"><i class="dot r"></i> Kırmızı <small>Yapılmadı</small></button>
    <button type="button" role="menuitem" data-mark="" class="m-clear"><i class="dot n"></i> Temizle</button>
  </div>

  <!-- Ekle / düzenle (Karta basılı tutunca açılır) -->
  <dialog id="editor" class="editor" aria-labelledby="editorTitle">
    <form id="editorForm" method="dialog">
      <h2 id="editorTitle">Yeni madde</h2>
      <label>Madde adı
        <input name="name" required maxlength="60" autocomplete="off" placeholder="Örn. Diş fırçalama, Göğüs egzersizi">
      </label>
      <label>Hedef / not <span class="opt">(isteğe bağlı)</span>
        <input name="detail" maxlength="80" autocomplete="off" placeholder="Örn. Sabah & akşam, 3×12 tekrar">
      </label>

      <div class="field-block">
        <span class="field-label">Sayaç / Tekrar / Miktar</span>
        <div class="goal-type-row" id="goalTypeRow">
          <button type="button" class="goal-type-btn active" data-goal-type="none">Yok</button>
          <button type="button" class="goal-type-btn" data-goal-type="timer">⏱️ Sayaç</button>
          <button type="button" class="goal-type-btn" data-goal-type="reps">🔁 Tekrar</button>
          <button type="button" class="goal-type-btn" data-goal-type="amount">📊 Miktar</button>
        </div>

        <div id="goalTimerBox" class="goal-config-box" hidden>
          <div class="inline-inputs">
            <label>Saat
              <input type="number" name="timerHour" min="0" max="99" value="0">
            </label>
            <label>Dakika
              <input type="number" name="timerMin" min="0" max="999" value="2">
            </label>
          </div>
          <div class="preset-chips" id="timerPresets">
            <button type="button" class="chip" data-h="0" data-m="1">1 dk</button>
            <button type="button" class="chip" data-h="0" data-m="2">2 dk</button>
            <button type="button" class="chip" data-h="0" data-m="3">3 dk</button>
            <button type="button" class="chip" data-h="0" data-m="5">5 dk</button>
            <button type="button" class="chip" data-h="0" data-m="10">10 dk</button>
            <button type="button" class="chip" data-h="0" data-m="30">30 dk</button>
            <button type="button" class="chip" data-h="1" data-m="0">1 saat</button>
            <button type="button" class="chip" data-h="2" data-m="0">2 saat</button>
            <button type="button" class="chip" data-h="3" data-m="0">3 saat</button>
          </div>
        </div>

        <div id="goalRepsBox" class="goal-config-box" hidden>
          <label>Hedef Tekrar Sayısı
            <input type="number" name="repsTarget" min="1" max="99999" placeholder="Örn. 30">
          </label>
          <div class="preset-chips" id="repsPresets">
            <button type="button" class="chip" data-reps="10">10 tekrar</button>
            <button type="button" class="chip" data-reps="15">15 tekrar</button>
            <button type="button" class="chip" data-reps="20">20 tekrar</button>
            <button type="button" class="chip" data-reps="30">30 tekrar</button>
            <button type="button" class="chip" data-reps="50">50 tekrar</button>
            <button type="button" class="chip" data-reps="100">100 tekrar</button>
          </div>
        </div>

        <div id="goalAmountBox" class="goal-config-box" hidden>
          <div class="inline-inputs">
            <label>Hedef Miktar
              <input type="number" step="any" name="amountTarget" min="0.1" placeholder="Örn. 2000">
            </label>
            <label>Birim
              <input type="text" name="amountUnit" maxlength="15" placeholder="ml, g, kcal...">
            </label>
          </div>
          <div class="preset-chips" id="unitPresets">
            <button type="button" class="chip" data-unit="ml">ml</button>
            <button type="button" class="chip" data-unit="L">L</button>
            <button type="button" class="chip" data-unit="g">g</button>
            <button type="button" class="chip" data-unit="kcal">kcal</button>
            <button type="button" class="chip" data-unit="adım">adım</button>
            <button type="button" class="chip" data-unit="bardak">bardak</button>
            <button type="button" class="chip" data-unit="sayfa">sayfa</button>
            <button type="button" class="chip" data-unit="adet">adet</button>
          </div>
        </div>
      </div>

      <!-- Alt Başlıklar (Ana sayfada önizlemesi yok, sadece basılı tutup içine girince görünür) -->
      <div class="field-block">
        <span class="field-label">Alt başlıklar <span class="opt" id="subtaskCount">(0)</span></span>
        <div id="subtasksList" class="subtasks-list"></div>
        <div class="subtask-add-row">
          <input type="text" id="newSubtaskInput" maxlength="80" autocomplete="off" placeholder="Alt başlık ekle...">
          <button type="button" id="addSubtaskBtn" class="primary">＋ Ekle</button>
        </div>
      </div>

      <div class="editor-actions">
        <button type="button" id="deleteBtn" class="danger" hidden>Sil</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn" class="ghost">Vazgeç</button>
        <button type="submit" class="primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- Karta tıklayınca açılan Sayaç / Miktar / Tekrar Arayüzü -->
  <dialog id="actionModal" class="editor" aria-labelledby="actionTitle">
    <div id="actionBody"></div>
  </dialog>

  <!-- Görev Ekle / Düzenle Penceresi (Google Görevler Tarzı) -->
  <dialog id="taskEditor" class="editor task-editor-dialog" aria-labelledby="taskEditorTitle">
    <form id="taskEditorForm" method="dialog">
      <div id="taskEditorMainView">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px">
          <h2 id="taskEditorTitle" style="margin:0">Yeni görev</h2>
          <button type="button" id="taskStarToggleBtn" class="chip">☆ Yıldızla</button>
        </div>
        <label>Görev adı
          <input name="taskTitle" required maxlength="100" autocomplete="off" placeholder="Örn. Faturayı öde, Market alışverişi yap">
        </label>
        <label>Ayrıntılar / Not <span class="opt">(isteğe bağlı)</span>
          <input name="taskDetail" maxlength="160" autocomplete="off" placeholder="Ayrıntı ekle...">
        </label>
        <div class="field-block">
          <span class="field-label">Tarih / Zaman <span class="opt">(isteğe bağlı)</span></span>
          <input type="hidden" name="taskDueDate" id="taskDueDateHidden">
          <div class="dt-field-row">
            <button type="button" id="openTaskDatePickerBtn" class="dt-select-btn">
              <span>📅</span>
              <span id="taskDueDateLabel" class="dt-select-text muted">Tarih ve saat seçmek için dokun...</span>
              <span id="taskDueDateActionBadge" class="dt-action-badge">🕒 Seç</span>
            </button>
            <button type="button" id="clearTaskDueDateBtn" class="dt-clear-btn" hidden aria-label="Tarihi temizle">✕</button>
          </div>
        </div>
        <div class="field-block">
          <span class="field-label">Alt görevler <span class="opt" id="taskSubtaskCount">(0)</span></span>
          <div id="taskSubtasksList" class="subtasks-list"></div>
          <div class="subtask-add-row">
            <input type="text" id="newTaskSubtaskInput" maxlength="80" autocomplete="off" placeholder="Alt görev ekle...">
            <button type="button" id="addTaskSubtaskBtn" class="primary">＋ Ekle</button>
          </div>
        </div>
        <div class="editor-actions">
          <button type="button" id="deleteTaskBtn" class="danger" hidden>Sil</button>
          <span class="spacer"></span>
          <button type="button" id="cancelTaskBtn" class="ghost">Vazgeç</button>
          <button type="submit" class="primary">Kaydet</button>
        </div>
      </div>

      <div id="taskDatePickerView" hidden>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <button type="button" id="closeDatePickerBackBtn" class="ghost" style="padding:4px 10px">‹ Geri</button>
          <h2 style="margin:0;font-size:1.1rem">Tarih ve Saat Seç</h2>
        </div>
        <div id="taskDatePickerBody"></div>
        <div class="editor-actions">
          <button type="button" id="clearDatePickerBtn" class="danger">Temizle</button>
          <span class="spacer"></span>
          <button type="button" id="cancelDatePickerBtn" class="ghost">Vazgeç</button>
          <button type="button" id="applyDatePickerBtn" class="primary">✓ Seç</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
